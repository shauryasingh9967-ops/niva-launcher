name: Unpack project upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show .github files bundled in the zip
        run: |
          unzip -o niva-upload.zip -d /tmp/unpacked
          echo "=== .github tree ==="
          find /tmp/unpacked/.github -type f 2>/dev/null | sort || echo "(no .github directory)"
          if [ -d /tmp/unpacked/.github/workflows ]; then
            for f in $(find /tmp/unpacked/.github/workflows -type f | sort); do
              echo "----- BEGIN ${f#/tmp/unpacked/} -----"
              cat "$f"
              echo "----- END ${f#/tmp/unpacked/} -----"
            done
          fi

      - name: Unpack project zip into repo root
        run: |
          shopt -s dotglob
          cp -r /tmp/unpacked/. .
          rm -rf /tmp/unpacked niva-upload.zip
          # remove this one-shot workflow so the final tree stays clean
          rm -f .github/workflows/unpack.yml
          # NOTE: the Actions token cannot create/update workflow files, so
          # the project's own workflow files are excluded here and will be
          # restored via the web UI afterwards.
          rm -f .github/workflows/*.yml .github/workflows/*.yaml

      - name: Commit unpacked tree
        run: |
          git config user.name "Shaurya Singh"
          git config user.email "shauryasingh9967@gmail.com"
          git add -A
          git commit -m "Niva Launcher: complete project tree" || echo "nothing to commit"
          git push origin HEAD:main
