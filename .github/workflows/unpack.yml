name: Unpack project upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip into repo root
        run: |
          unzip -o niva-upload2.zip -d /tmp/unpacked
          shopt -s dotglob
          cp -r /tmp/unpacked/. .
          rm -rf /tmp/unpacked niva-upload2.zip
          rm -f .github/workflows/unpack.yml

      - name: Commit unpacked tree
        run: |
          git config user.name "Shaurya Singh"
          git config user.email "shauryasingh9967@gmail.com"
          git add -A
          git reset -q .github/workflows/ || true
          git commit -m "rebrand: rename namespace to com.niva.launcher, Grace identifiers to Niva" || echo "nothing to commit"
          git push origin HEAD:main
