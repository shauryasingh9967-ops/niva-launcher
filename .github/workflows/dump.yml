name: Dump ci file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump ci.yml from the original upload commit
        run: |
          sha=$(git log --all --diff-filter=A --format=%H -- niva-upload.zip | head -1)
          echo "zip commit: $sha"
          git show "$sha:niva-upload.zip" > /tmp/niva.zip
          unzip -o /tmp/niva.zip -d /tmp/n
          echo "=== line count ==="
          wc -l /tmp/n/.github/workflows/ci.yml
          echo "=== cat -A (shows all characters) ==="
          cat -A /tmp/n/.github/workflows/ci.yml
          echo "=== END ==="
